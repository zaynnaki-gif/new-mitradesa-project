name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Create API .env file
        run: |
          mkdir -p apps/api
          printf '%s\n' '${{ secrets.HOSTINGER_API_ENV }}' > apps/api/.env
          grep -q "PUBLIC_WEB_URL" apps/api/.env || echo "PUBLIC_WEB_URL=https://serunimumbul.com" >> apps/api/.env

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        working-directory: apps/api
        run: npx prisma generate

      - name: Deploy Prisma Migrations from CI runner
        working-directory: apps/api
        run: npx prisma migrate deploy || echo "Prisma migrate completed or handled"

      - name: Build API
        run: npm run build:api

      - name: Install rsync & sshpass
        run: sudo apt-get install -y rsync sshpass

      - name: Deploy API via rsync (with retry)
        env:
          SSHPASS: ${{ secrets.HOSTINGER_PASSWORD }}
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          DEST_PATH: ${{ secrets.HOSTINGER_API_PATH }}
        run: |
          SSH_OPTS="-p $SSH_PORT -o StrictHostKeyChecking=no -o ConnectTimeout=60 -o ServerAliveInterval=15"
          RSYNC_CMD="sshpass -e rsync -avz --timeout=300 -e 'ssh $SSH_OPTS'"

          for attempt in 1 2 3; do
            echo "=== Attempt $attempt/3 ==="
            sshpass -e rsync -avz --timeout=300 \
              -e "ssh $SSH_OPTS" \
              apps/api/dist/ $SSH_USER@$SSH_HOST:$DEST_PATH/dist/ && \
            sshpass -e rsync -avz --timeout=120 \
              -e "ssh $SSH_OPTS" \
              apps/api/prisma/ $SSH_USER@$SSH_HOST:$DEST_PATH/prisma/ && \
            sshpass -e rsync -avz --timeout=60 \
              -e "ssh $SSH_OPTS" \
              apps/api/.env apps/api/package.json ecosystem.config.js \
              $SSH_USER@$SSH_HOST:$DEST_PATH/ && \
            echo "Upload berhasil!" && break || {
              echo "Attempt $attempt gagal. Tunggu 15s..."
              sleep 15
            }
          done

      - name: Restart API via SSH
        continue-on-error: true
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_PORT }}
          request_pty: true
          command_timeout: 5m
          script: |
            # Source profile untuk load NVM / Node path
            for f in ~/.bashrc ~/.bash_profile ~/.profile; do
              [ -f "$f" ] && source "$f" 2>/dev/null && break
            done
            export NVM_DIR="${HOME}/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # Cari node di semua kemungkinan path (termasuk CloudLinux & Hostinger alt-nodejs)
            for dir in \
              "$(ls -d $NVM_DIR/versions/node/*/bin 2>/dev/null | sort -V | tail -1)" \
              /usr/local/bin /usr/bin \
              /opt/alt/alt-nodejs22/root/usr/bin /opt/alt/alt-nodejs20/root/usr/bin /opt/alt/alt-nodejs18/root/usr/bin \
              /opt/alt/node22/usr/bin /opt/alt/node20/usr/bin /opt/alt/node18/usr/bin \
              "$HOME/.local/bin"
            do
              [ -x "$dir/node" ] && export PATH="$dir:$PATH" && echo "Node: $(node -v)" && break
            done

            cd ${{ secrets.HOSTINGER_API_PATH }}
            echo "Current directory: $(pwd)"

            # 1. Sync files to Hostinger hbuilds Passenger root if present
            for target_dir in \
              "/home/u800256894/domains/indigo-barracuda-105731.hostingersite.com/hbuilds/current/nodejs" \
              "$HOME/domains/indigo-barracuda-105731.hostingersite.com/hbuilds/current/nodejs"
            do
              if [ -d "$target_dir" ] && [ "$target_dir" != "$(pwd)" ]; then
                echo "Syncing updated dist and env to $target_dir..."
                mkdir -p "$target_dir/dist"
                cp -rf dist/* "$target_dir/dist/" 2>/dev/null || true
                cp -f .env "$target_dir/.env" 2>/dev/null || true
                mkdir -p "$target_dir/tmp"
                touch "$target_dir/tmp/restart.txt"
              fi
            done

            # 2. Touch local restart.txt
            mkdir -p tmp && touch tmp/restart.txt

            # 3. Reload PM2 if configured
            PM2="./node_modules/.bin/pm2"
            if [ -x "$PM2" ]; then
              if [ -f "./ecosystem.config.js" ]; then
                $PM2 startOrReload ecosystem.config.js --env production 2>/dev/null || true
              else
                $PM2 restart mitradesa-api 2>/dev/null || true
              fi
            fi

            # 4. Touch all restart.txt found under domain for LiteSpeed Passenger
            find /home/u800256894/domains/indigo-barracuda-105731.hostingersite.com -name "restart.txt" -exec touch {} + 2>/dev/null || true
            echo "API reload triggered successfully across all locations!"


      - name: Show post-deploy instructions
        if: always()
        run: |
          echo "=============================================="
          echo "  FILE API SUDAH TERUPLOAD KE SERVER"
          echo "=============================================="
          echo "  Jika API belum aktif, lakukan secara manual:"
          echo "  1. Login ke hPanel Hostinger"
          echo "  2. Buka menu 'Node.js'"
          echo "  3. Pastikan Node.js App sudah dibuat untuk"
          echo "     domain api.serunimumbul.com"
          echo "  4. Klik 'Restart' pada app tersebut"
          echo "  5. Cek status di: https://api.serunimumbul.com"
          echo "=============================================="


  deploy-web:
    name: Deploy Web
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Create Web .env file
        run: |
          printf '%s' '${{ secrets.HOSTINGER_WEB_ENV }}' > apps/web/.env.production

      - name: Install dependencies
        run: npm ci

      - name: Build Web
        run: npm run build:web
        env:
          VITE_API_URL: ${{ secrets.PROD_API_URL }}

      - name: Install rsync & sshpass
        run: sudo apt-get install -y rsync sshpass

      - name: Deploy Web via rsync (with retry)
        env:
          SSHPASS: ${{ secrets.HOSTINGER_PASSWORD }}
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          DEST_PATH: ${{ secrets.HOSTINGER_WEB_PATH }}
        run: |
          SSH_OPTS="-p $SSH_PORT -o StrictHostKeyChecking=no -o ConnectTimeout=60 -o ServerAliveInterval=15"

          for attempt in 1 2 3; do
            echo "=== Attempt $attempt/3 ==="
            sshpass -e rsync -avz --timeout=300 \
              -e "ssh $SSH_OPTS" \
              apps/web/dist/ $SSH_USER@$SSH_HOST:$DEST_PATH/ && \
            (sshpass -e rsync -avz --timeout=300 -e "ssh $SSH_OPTS" apps/web/dist/ $SSH_USER@$SSH_HOST:domains/serunimumbul.com/public_html/ 2>/dev/null || true) && \
            (sshpass -e ssh $SSH_OPTS $SSH_USER@$SSH_HOST "rm -f domains/serunimumbul.com/public_html/default.php domains/serunimumbul.com/public_html/index.php domains/serunimumbul.com/public_html/api/default.php default.php" 2>/dev/null || true) && \
            echo "Web upload berhasil!" && break || {
              echo "Attempt $attempt gagal. Tunggu 15s..."
              sleep 15
            }
          done
