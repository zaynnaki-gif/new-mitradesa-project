name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Create API .env file
        run: |
          cat > apps/api/.env << 'EOF'
          ${{ secrets.HOSTINGER_API_ENV }}
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        working-directory: apps/api
        run: npx prisma generate

      - name: Build API
        run: npm run build:api

      - name: Create API archive
        run: |
          cd apps/api
          tar -czf ../api-deploy.tar.gz dist package.json package-lock.json prisma .env

      - name: Deploy to Hostinger via SSH
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_PORT || '22' }}
          source: "api-deploy.tar.gz"
          target: "${{ secrets.HOSTINGER_API_PATH }}"
          strip_components: 0
          overwrite: true

      - name: Run remote commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_PORT || '22' }}
          script: |
            cd ${{ secrets.HOSTINGER_API_PATH }}
            tar -xzf api-deploy.tar.gz
            rm api-deploy.tar.gz
            npm install --omit=dev
            npx prisma generate
            npx prisma migrate deploy || echo "Migration skipped (no pending migrations)"
            pm2 restart mitradesa-api || (pm2 delete mitradesa-api 2>/dev/null; pm2 start npm --name "mitradesa-api" -- start)

  deploy-web:
    name: Deploy Web
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Create Web .env file
        run: |
          cat > apps/web/.env.production << 'EOF'
          ${{ secrets.HOSTINGER_WEB_ENV }}
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Build Web
        run: npm run build:web
        env:
          VITE_API_URL: ${{ secrets.PROD_API_URL }}

      - name: Create Web archive
        run: tar -czf web-deploy.tar.gz -C apps/web dist

      - name: Deploy to Hostinger via SSH
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_PORT || '22' }}
          source: "web-deploy.tar.gz"
          target: "${{ secrets.HOSTINGER_WEB_PATH }}"
          strip_components: 0
          overwrite: true

      - name: Extract Web files
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_PORT || '22' }}
          script: |
            cd ${{ secrets.HOSTINGER_WEB_PATH }}
            rm -rf *
            tar -xzf web-deploy.tar.gz
            rm web-deploy.tar.gz
