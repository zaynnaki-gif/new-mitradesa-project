name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Create API .env file
        run: |
          mkdir -p apps/api
          printf '%s\n' '${{ secrets.HOSTINGER_API_ENV }}' > apps/api/.env
          grep -q "PUBLIC_WEB_URL" apps/api/.env || echo "PUBLIC_WEB_URL=https://serunimumbul.com" >> apps/api/.env

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        working-directory: apps/api
        run: npx prisma generate

      - name: Deploy Prisma Migrations from CI runner
        working-directory: apps/api
        run: npx prisma migrate deploy || echo "Prisma migrate completed or handled"

      - name: Build API
        run: npm run build:api

      - name: Install rsync & sshpass
        run: sudo apt-get install -y rsync sshpass

      - name: Deploy API via rsync (with retry)
        env:
          SSHPASS: ${{ secrets.HOSTINGER_PASSWORD }}
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          DEST_PATH: ${{ secrets.HOSTINGER_API_PATH }}
        run: |
          SSH_OPTS="-p $SSH_PORT -o StrictHostKeyChecking=no -o ConnectTimeout=60 -o ServerAliveInterval=15"
          RSYNC_CMD="sshpass -e rsync -avz --timeout=300 -e 'ssh $SSH_OPTS'"

          for attempt in 1 2 3; do
            echo "=== Attempt $attempt/3 ==="
            sshpass -e rsync -avz --timeout=300 \
              -e "ssh $SSH_OPTS" \
              apps/api/dist/ $SSH_USER@$SSH_HOST:$DEST_PATH/dist/ && \
            sshpass -e rsync -avz --timeout=120 \
              -e "ssh $SSH_OPTS" \
              apps/api/prisma/ $SSH_USER@$SSH_HOST:$DEST_PATH/prisma/ && \
            sshpass -e rsync -avz --timeout=60 \
              -e "ssh $SSH_OPTS" \
              apps/api/.env apps/api/package.json ecosystem.config.js \
              $SSH_USER@$SSH_HOST:$DEST_PATH/ && \
            echo "Upload berhasil!" && break || {
              echo "Attempt $attempt gagal. Tunggu 15s..."
              sleep 15
            }
          done

          echo "=== Executing remote sync & diagnostics on Hostinger ==="
          sshpass -e ssh $SSH_OPTS $SSH_USER@$SSH_HOST "
            echo \"=== REMOTE PWD: \$(pwd) ===\"
            echo \"=== PROCESSES ===\"
            ps aux || ps -ef
            echo \"=== DOMAIN ROOT ===\"
            ls -la /home/u800256894/domains/indigo-barracuda-105731.hostingersite.com/
            echo \"=== HBUILDS DIR ===\"
            ls -la /home/u800256894/domains/indigo-barracuda-105731.hostingersite.com/hbuilds/ || true
            echo \"=== HBUILDS CURRENT ===\"
            ls -la /home/u800256894/domains/indigo-barracuda-105731.hostingersite.com/hbuilds/current/ || true

            for target_dir in \
              /home/u800256894/domains/indigo-barracuda-105731.hostingersite.com/hbuilds/current/nodejs \
              /home/u800256894/domains/indigo-barracuda-105731.hostingersite.com/hbuilds/current \
              \$HOME/domains/indigo-barracuda-105731.hostingersite.com/hbuilds/current/nodejs
            do
              if [ -d \"\$target_dir\" ]; then
                echo \"Syncing to \$target_dir...\"
                mkdir -p \"\$target_dir/dist\" \"\$target_dir/prisma\" \"\$target_dir/tmp\"
                cp -rf $DEST_PATH/dist/* \"\$target_dir/dist/\" 2>/dev/null || true
                cp -rf $DEST_PATH/prisma/* \"\$target_dir/prisma/\" 2>/dev/null || true
                cp -f $DEST_PATH/.env \"\$target_dir/.env\" 2>/dev/null || true
                touch \"\$target_dir/tmp/restart.txt\"
                echo \"Content of \$target_dir/dist:\"; ls -la \"\$target_dir/dist/\"
              fi
            done

            echo \"Terminating lsnode worker process to trigger fresh cold-start...\"
            kill -9 $(pgrep -f '^lsnode:' 2>/dev/null) 2>/dev/null || true
            touch /home/u800256894/domains/indigo-barracuda-105731.hostingersite.com/hbuilds/current/nodejs/tmp/restart.txt 2>/dev/null || true
            echo \"Worker terminated. LiteSpeed will spawn fresh process on next request.\"
            exit 0
          "

      - name: Show post-deploy instructions
        if: always()
        run: |
          echo "=============================================="
          echo "  FILE API SUDAH TERUPLOAD KE SERVER"
          echo "=============================================="
          echo "  Jika API belum aktif, lakukan secara manual:"
          echo "  1. Login ke hPanel Hostinger"
          echo "  2. Buka menu 'Node.js'"
          echo "  3. Pastikan Node.js App sudah dibuat untuk"
          echo "     domain api.serunimumbul.com"
          echo "  4. Klik 'Restart' pada app tersebut"
          echo "  5. Cek status di: https://api.serunimumbul.com"
          echo "=============================================="


  deploy-web:
    name: Deploy Web
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Create Web .env file
        run: |
          printf '%s' '${{ secrets.HOSTINGER_WEB_ENV }}' > apps/web/.env.production

      - name: Install dependencies
        run: npm ci

      - name: Build Web
        run: npm run build:web
        env:
          VITE_API_URL: ${{ secrets.PROD_API_URL }}

      - name: Install rsync & sshpass
        run: sudo apt-get install -y rsync sshpass

      - name: Deploy Web via rsync (with retry)
        env:
          SSHPASS: ${{ secrets.HOSTINGER_PASSWORD }}
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          DEST_PATH: ${{ secrets.HOSTINGER_WEB_PATH }}
        run: |
          SSH_OPTS="-p $SSH_PORT -o StrictHostKeyChecking=no -o ConnectTimeout=60 -o ServerAliveInterval=15"

          for attempt in 1 2 3; do
            echo "=== Attempt $attempt/3 ==="
            sshpass -e rsync -avz --timeout=300 \
              -e "ssh $SSH_OPTS" \
              apps/web/dist/ $SSH_USER@$SSH_HOST:$DEST_PATH/ && \
            (sshpass -e rsync -avz --timeout=300 -e "ssh $SSH_OPTS" apps/web/dist/ $SSH_USER@$SSH_HOST:domains/serunimumbul.com/public_html/ 2>/dev/null || true) && \
            (sshpass -e ssh $SSH_OPTS $SSH_USER@$SSH_HOST "rm -f domains/serunimumbul.com/public_html/default.php domains/serunimumbul.com/public_html/index.php domains/serunimumbul.com/public_html/api/default.php default.php" 2>/dev/null || true) && \
            echo "Web upload berhasil!" && break || {
              echo "Attempt $attempt gagal. Tunggu 15s..."
              sleep 15
            }
          done
