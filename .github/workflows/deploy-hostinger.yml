name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Create API .env file
        run: |
          mkdir -p apps/api
          cat > apps/api/.env << 'EOF'
          ${{ secrets.HOSTINGER_API_ENV }}
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        working-directory: apps/api
        run: npx prisma generate

      - name: Build API
        run: npm run build:api

      - name: Create API deployment package
        run: |
          mkdir -p deploy-api
          cp -r apps/api/dist deploy-api/
          cp apps/api/.env deploy-api/.env
          cp package.json package-lock.json deploy-api/
          cp apps/api/package.json deploy-api/
          tar -czf api-deploy.tar.gz -C deploy-api .

      - name: Deploy API to Hostinger
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_PORT }}
          command_timeout: 10m
          source: "api-deploy.tar.gz"
          target: "${{ secrets.HOSTINGER_API_PATH }}"
          strip_components: 0
          overwrite: true

      - name: Run remote commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_PORT }}
          command_timeout: 10m
          script: |
            cd ${{ secrets.HOSTINGER_API_PATH }}
            tar -xzf api-deploy.tar.gz
            rm api-deploy.tar.gz
            npm install --omit=dev
            npm install -g pm2
            npx prisma generate
            npx prisma migrate deploy || echo "Migration skipped"
            pm2 restart mitradesa-api || (pm2 delete mitradesa-api 2>/dev/null; pm2 start npm --name "mitradesa-api" -- start)

  deploy-web:
    name: Deploy Web
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Create Web .env file
        run: |
          cat > apps/web/.env.production << 'EOF'
          ${{ secrets.HOSTINGER_WEB_ENV }}
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Build Web
        run: npm run build:web
        env:
          VITE_API_URL: ${{ secrets.PROD_API_URL }}

      - name: Deploy Web to Hostinger
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_PORT }}
          command_timeout: 10m
          source: "apps/web/dist/*"
          target: "${{ secrets.HOSTINGER_WEB_PATH }}"
          strip_components: 0
          overwrite: true

      - name: Clean Web folder
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_PORT }}
          command_timeout: 10m
          script: |
            cd ${{ secrets.HOSTINGER_WEB_PATH }}
            ls -la
