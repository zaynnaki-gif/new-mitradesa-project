name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Create API .env file
        run: |
          mkdir -p apps/api
          printf '%s' '${{ secrets.HOSTINGER_API_ENV }}' > apps/api/.env

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        working-directory: apps/api
        run: npx prisma generate

      - name: Build API
        run: npm run build:api

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy API via FTP
        env:
          FTP_HOST: ${{ secrets.HOSTINGER_FTP_HOST }}
          FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
          FTP_PASS: ${{ secrets.HOSTINGER_FTP_PASS }}
          FTP_PATH: ${{ secrets.HOSTINGER_API_PATH }}
        run: |
          lftp -c "
            set ftp:ssl-allow yes;
            set ftp:ssl-force false;
            set ssl:verify-certificate no;
            set net:timeout 60;
            set net:max-retries 5;
            set net:reconnect-interval-base 5;
            open -u '$FTP_USER','$FTP_PASS' ftp://$FTP_HOST;
            mirror --reverse --delete --verbose=1 \
              --exclude node_modules \
              --exclude .git \
              apps/api/dist/ $FTP_PATH/dist/;
            put apps/api/.env -o $FTP_PATH/.env;
            put apps/api/package.json -o $FTP_PATH/package.json;
            bye
          "
          echo "FTP upload selesai"

      - name: Restart Node.js App via Hostinger API
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        run: |
          # Trigger restart via Hostinger API if token is set
          if [ -n "$HOSTINGER_API_TOKEN" ]; then
            curl -s -X POST \
              "https://api.hostinger.com/v1/hosting/api.serunimumbul.com/nodejs/restart" \
              -H "Authorization: Bearer $HOSTINGER_API_TOKEN" \
              -H "Content-Type: application/json" \
              || echo "API restart endpoint not available - restart manually from hPanel"
          else
            echo "HOSTINGER_API_TOKEN not set - restart Node.js App manually from hPanel > Node.js"
          fi


  deploy-web:
    name: Deploy Web
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Create Web .env file
        run: |
          printf '%s' '${{ secrets.HOSTINGER_WEB_ENV }}' > apps/web/.env.production

      - name: Install dependencies
        run: npm ci

      - name: Build Web
        run: npm run build:web
        env:
          VITE_API_URL: ${{ secrets.PROD_API_URL }}

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy Web via FTP
        env:
          FTP_HOST: ${{ secrets.HOSTINGER_FTP_HOST }}
          FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
          FTP_PASS: ${{ secrets.HOSTINGER_FTP_PASS }}
          FTP_PATH: ${{ secrets.HOSTINGER_WEB_PATH }}
        run: |
          lftp -c "
            set ftp:ssl-allow yes;
            set ftp:ssl-force false;
            set ssl:verify-certificate no;
            set net:timeout 60;
            set net:max-retries 5;
            set net:reconnect-interval-base 5;
            open -u '$FTP_USER','$FTP_PASS' ftp://$FTP_HOST;
            mirror --reverse --delete --verbose=1 \
              apps/web/dist/ $FTP_PATH/;
            bye
          "
          echo "Web FTP upload selesai"
