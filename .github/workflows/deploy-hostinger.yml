name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Create API .env file
        run: |
          mkdir -p apps/api
          cat > apps/api/.env << 'EOF'
          ${{ secrets.HOSTINGER_API_ENV }}
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        working-directory: apps/api
        run: npx prisma generate

      - name: Build API
        run: npm run build:api

      - name: Install rsync & sshpass
        run: sudo apt-get install -y rsync sshpass

      - name: Deploy API dist via rsync over SSH
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          SSH_PASS: ${{ secrets.HOSTINGER_PASSWORD }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          DEST_PATH: ${{ secrets.HOSTINGER_API_PATH }}
        run: |
          # rsync upload dengan retry dan timeout lebih panjang
          export SSHPASS=$SSH_PASS
          sshpass -e rsync -avz --timeout=300 \
            -e "ssh -p $SSH_PORT -o StrictHostKeyChecking=no -o ConnectTimeout=30" \
            apps/api/dist/ \
            $SSH_USER@$SSH_HOST:$DEST_PATH/dist/
          
          sshpass -e rsync -avz --timeout=60 \
            -e "ssh -p $SSH_PORT -o StrictHostKeyChecking=no -o ConnectTimeout=30" \
            apps/api/.env apps/api/package.json \
            $SSH_USER@$SSH_HOST:$DEST_PATH/

      - name: Discover Node path & Restart API
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_PORT }}
          request_pty: true
          command_timeout: 5m
          script: |
            # Source all possible profile files
            [ -f ~/.bashrc ] && source ~/.bashrc 2>/dev/null || true
            [ -f ~/.bash_profile ] && source ~/.bash_profile 2>/dev/null || true
            [ -f ~/.profile ] && source ~/.profile 2>/dev/null || true

            # NVM
            export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh" || true

            # Find node - try every possible path on Hostinger
            NODE_PATH=""
            for candidate in \
              "$NVM_DIR/versions/node/$(ls $NVM_DIR/versions/node 2>/dev/null | sort -V | tail -1)/bin" \
              "$HOME/.local/bin" \
              "/usr/local/bin" \
              "/usr/bin" \
              "/opt/alt/node20/usr/bin" \
              "/opt/alt/node18/usr/bin" \
              "/usr/local/nodejs/bin"
            do
              if [ -x "$candidate/node" ]; then
                NODE_PATH="$candidate"
                break
              fi
            done

            if [ -z "$NODE_PATH" ]; then
              echo "ERROR: node not found in any path!"
              which node 2>&1 || true
              find / -name "node" -type f 2>/dev/null | head -5
              exit 1
            fi

            export PATH="$NODE_PATH:$PATH"
            echo "Using Node from: $NODE_PATH"
            echo "node: $(node -v) | npm: $(npm -v)"

            cd ${{ secrets.HOSTINGER_API_PATH }}
            npm install --omit=dev --quiet

            # pm2 - local install fallback
            if ! command -v pm2 &>/dev/null && [ ! -f "./node_modules/.bin/pm2" ]; then
              npm install pm2 --save-dev --quiet
            fi
            PM2="$(command -v pm2 2>/dev/null || echo ./node_modules/.bin/pm2)"
            echo "pm2 path: $PM2"

            npx prisma migrate deploy 2>/dev/null || echo "Migration skipped"

            $PM2 stop mitradesa-api 2>/dev/null || true
            $PM2 delete mitradesa-api 2>/dev/null || true
            NODE_PATH="$NODE_PATH" $PM2 start dist/index.js --name mitradesa-api
            $PM2 save --force
            $PM2 list



  deploy-web:
    name: Deploy Web
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Create Web .env file
        run: |
          cat > apps/web/.env.production << 'EOF'
          ${{ secrets.HOSTINGER_WEB_ENV }}
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Build Web
        run: npm run build:web
        env:
          VITE_API_URL: ${{ secrets.PROD_API_URL }}

      - name: Install rsync & sshpass
        run: sudo apt-get install -y rsync sshpass

      - name: Deploy Web via rsync over SSH
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          SSH_PASS: ${{ secrets.HOSTINGER_PASSWORD }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          DEST_PATH: ${{ secrets.HOSTINGER_WEB_PATH }}
        run: |
          export SSHPASS=$SSH_PASS
          sshpass -e rsync -avz --delete --timeout=300 \
            -e "ssh -p $SSH_PORT -o StrictHostKeyChecking=no -o ConnectTimeout=60" \
            apps/web/dist/ \
            $SSH_USER@$SSH_HOST:$DEST_PATH/
          echo "Web deploy selesai!"
